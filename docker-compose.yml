x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ecommerce
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  api:
    <<: *app
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=4

  beat:
    <<: *app
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
